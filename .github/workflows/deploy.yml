name: Deploy to GitHub Pages

# Content lives here; the build tooling lives in tmrw-education/help-site.
# This job pulls both together, builds, and publishes to GitHub Pages.

on:
  push:
    branches:
      - main
  # PRs build too (no deploy): a broken link or a link to a draft page fails the check
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'  # daily 05:00 UTC catch-all (picks up help-site tooling changes too)

permissions:
  contents: write

# One deploy at a time: a push here and a help-site push used to start two runs that raced to
# publish, and the loser failed. Now they queue; a waiting run that's overtaken is cancelled
# (the newer one carries everything). PR checks don't deploy, so each PR gets its own group.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'deploy' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      # Lay the two repos out as siblings so the site's config can read content
      # from ../help (the same CONTENT default it uses for local dev).
      - name: Checkout content (this repo)
        uses: actions/checkout@v5
        with:
          path: help

      - name: Checkout site tooling
        uses: actions/checkout@v5
        with:
          repository: tmrw-education/help-site
          path: site

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: site

      - name: Build
        run: npm run build
        working-directory: site

      # Only reached when the build passed: the site config fails the build on any broken link
      # (including a link to a `draft: true` page), so the live site keeps its last good version.
      - name: Deploy
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site/build
