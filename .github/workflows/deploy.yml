name: Deploy to GitHub Pages

# Content lives here; the build tooling lives in tmrw-education/help-site.
# This job pulls both together, builds, and publishes to GitHub Pages.

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'  # hourly catch-all (picks up help-site tooling changes too)

permissions:
  contents: write

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      # Lay the two repos out as siblings so the site's config can read content
      # from ../help (the same CONTENT default it uses for local dev).
      - name: Checkout content (this repo)
        uses: actions/checkout@v5
        with:
          path: help

      - name: Checkout site tooling
        uses: actions/checkout@v5
        with:
          repository: tmrw-education/help-site
          path: site

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: site

      - name: Build
        run: npm run build
        working-directory: site

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site/build
